var audioCtx = null;

function getAudioCtx() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
return audioCtx;
}

function playTone(freq, type, dur) {
if (!state.soundOn) return;
try {
var ctx = getAudioCtx();
var osc = ctx.createOscillator();
var gain = ctx.createGain();
osc.type = type;
osc.frequency.value = freq;
gain.gain.setValueAtTime(0.2, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start(ctx.currentTime);
osc.stop(ctx.currentTime + dur);
} catch(e) {}
}

function playCorrectSound() {
  playTone(1047, "sine", 0.08);
  setTimeout(function(){ playTone(1319, "sine", 0.08); }, 80);
  setTimeout(function(){ playTone(1568, "sine", 0.12); }, 160);
  speakEncouragement(["Excellent!", "Perfect!", "Brilliant!", "Outstanding!"]);
}

function playWrongSound() {
  playTone(220, "square", 0.18);
  speakEncouragement(["Try again!", "Keep going!", "Don't give up!"]);
}

function playBuzzSound() {
  playTone(880, "sine", 0.06);
  setTimeout(function(){ playTone(1047, "sine", 0.06); }, 65);
  setTimeout(function(){ playTone(1319, "sine", 0.08); }, 130);
}

  if (!state.soundOn) return;
  playTone(659, "sine", 0.12);
  setTimeout(function(){ playTone(784, "sine", 0.12); }, 120);

  setTimeout(function(){ playTone(1319, "sine", 0.25); }, 360);
  speakEncouragement(["Congratulations!", "You're the champion!", "Amazing victory!", "Incredible!"]);
}

function speakEncouragement(phrases) {
  if (!state.soundOn) return;
  if (!window.speechSynthesis) return;
  try {
    var phrase = phrases[Math.floor(Math.random() * phrases.length)];
    var utterance = new SpeechSynthesisUtterance(phrase);
    utterance.lang = "en-US";
    utterance.rate = 1.3;
    utterance.pitch = 1.4;
    utterance.volume = 0.9;
    window.speechSynthesis.speak(utterance);
  } catch(e) {}
}

function toggleSound() {
  state.soundOn = !state.soundOn;
  document.getElementById("sound-btn").textContent = state.soundOn ? "🔊" : "🔇";
}

function shuffle(arr) {
var a = arr.slice();
for (var i = a.length - 1; i > 0; i--) {
var j = Math.floor(Math.random() * (i + 1));
var tmp = a[i];
a[i] = a[j];
a[j] = tmp;
}
return a;
}

function pickRandom(arr, n) {
return shuffle(arr).slice(0, n);
}

function startGame() {
document.getElementById("screen-start").classList.add("hidden");
document.getElementById("game-container").classList.remove("hidden");
state.scores = [0, 0];
state.combos = [0, 0];
state.level = 1;
state.round4Correct = [0, 0];
state.round4Total = [0, 0];
updateScoreDisplay();
startLevel(1);
}

function restartGame() {
clearInterval(state.timerInterval);
hideOverlay();
document.getElementById("game-container").classList.add("hidden");
document.getElementById("screen-start").classList.remove("hidden");
state.scores = [0, 0];
state.combos = [0, 0];
state.level = 1;
state.isLocked = false;
state.waitingForComplement = false;
clearFeedback();
stopTimer();
showTimerBox(false);
}

function backToStart() {
clearInterval(state.timerInterval);
stopTimer();
hideOverlay();
document.getElementById("game-container").classList.add("hidden");
document.getElementById("screen-start").classList.remove("hidden");
state.scores = [0, 0];
state.combos = [0, 0];
state.level = 1;
state.questionIndex = 0;
state.isLocked = false;
state.buzzedPlayer = 0;
state.waitingForComplement = false;
clearFeedback();
showTimerBox(false);
}

var p1s = document.getElementById("p1-score-header");
var p2s = document.getElementById("p2-score-header");
if (p1s) p1s.textContent = state.scores[0];
if (p2s) p2s.textContent = state.scores[1];
}

var p1i = document.getElementById("p1-indicator");
var p2i = document.getElementById("p2-indicator");
if (!p1i || !p2i) return;
if (state.currentPlayer === 1) {
p1i.classList.add("bg-[#F2B84B]", "pulse-glow");
p1i.classList.remove("bg-gray-500");
p2i.classList.remove("bg-[#F2B84B]", "pulse-glow");

function startLevel(lv) {
state.level = lv;
state.questionIndex = 0;
state.isLocked = false;
state.waitingForComplement = false;
clearFeedback();
showTimerBox(false);
if (lv === 1) {

} else if (lv === 2) {
generateLevel2();
} else if (lv === 3) {
generateLevel3();
} else if (lv === 4) {
showRound4Intro();
return;
}
renderQuestion();
}

function generateLevel1() {
var pool = shuffle(proverbs.slice(0, 8));
var selected = pool.slice(0, 6);
state.levelQuestions = [];
for (var i = 0; i < selected.length; i++) {
var p = selected[i];
var others = proverbs.filter(function(x){ return x.id !== p.id; });
var wrongs = pickRandom(others, 3).map(function(x){ return x.cn; });
var opts = shuffle([p.cn].concat(wrongs));
state.levelQuestions.push({
proverb: p,
options: opts,
correctAnswer: p.cn
});
}
}

function processSimultaneousL1Answers() {
state.isLocked = true;
var q = state.levelQuestions[state.questionIndex];
var p1Correct = state.simultaneousAnswers.p1 === q.correctAnswer;
var p2Correct = state.simultaneousAnswers.p2 === q.correctAnswer;
if (p1Correct) {
state.scores[0] += 10;
}
if (p2Correct) {
state.scores[1] += 10;
}
updateScoreDisplay();
var msg = "";
if (p1Correct && p2Correct) {
msg = "🎉 两位玩家都答对了！各得10分";
playCorrectSound();
} else if (p1Correct) {
msg = "✅ 玩家1答对！+10分";
playCorrectSound();
} else if (p2Correct) {
msg = "✅ 玩家2答对！+10分";
playCorrectSound();
} else {
msg = "❌ 两位玩家都答错了";
playWrongSound();
}
showFeedbackRaw(msg, "正确答案：" + q.correctAnswer, p1Correct || p2Correct ? "#4CAF7D" : "#D96C6C");
setTimeout(nextQuestion, 2500);
}

function handleL3Answer(btn, selected) {
if (state.isLocked) return;
state.isLocked = true;
stopTimer();
var q = state.levelQuestions[state.questionIndex];
var isCorrect = selected === q.correctAnswer;
var answerer = state.buzzedPlayer;
var opponent = answerer === 1 ? 2 : 1;
if (isCorrect) {
state.combos[answerer - 1]++;
var bonus = state.combos[answerer - 1] >= 2 ? 10 : 0;
var pts = 20 + bonus;
state.scores[answerer - 1] += pts;
updateScoreDisplay();
playCorrectSound();
highlightBtn(btn, true);
var msg = randomEncourage() + " 抢答成功！+" + pts + "分";
showComboFloat(state.combos[answerer - 1]);
showFeedbackRaw(msg, "", "#4CAF7D");
} else {
state.combos[answerer - 1] = 0;
state.scores[opponent - 1] += 5;
updateScoreDisplay();
playWrongSound();
highlightBtn(btn, false);
markCorrectOption(q.correctAnswer);
showFeedbackRaw("答错了，对方得5分！", "正确答案：" + q.correctAnswer, "#D96C6C");
}
setTimeout(nextQuestion, 2500);
}

function nextQuestion() {

} else {
state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;

renderQuestion();
}

var panel = document.getElementById("overlay-panel");
var html = "";
html += '<h2 class="text-2xl font-bold text-[#1F3A5F] mb-3">第4关：限时车轮战</h2>';
html += '<p class="text-gray-600 mb-4 text-sm leading-relaxed">每位玩家各有 <strong>60秒</strong> 独立作答时间。<br>混合题型随机出现，答对+10分，连续答对3题起每连击+5加成。<br>玩家1先挑战，玩家2观看；然后交换。</p>';
html += '<button onclick="startRound4Turn(1)" class="bg-[#F2B84B] hover:bg-yellow-500 text-[#1F3A5F] font-bold px-8 py-3 rounded shadow transition-all hover:scale-105">玩家1 准备开始</button>';
panel.innerHTML = html;
showOverlay();
}

function startRound4Turn(player) {
hideOverlay();
state.round4ActivePlayer = player;
state.currentPlayer = player;
state.combos[player - 1] = 0;
state.round4Correct[player - 1] = 0;
state.round4Total[player - 1] = 0;
updatePlayerIndicator();
showTimerBox(true);
generateRound4Question();
startCountdown(60, function(){
endRound4Turn();
});
}

var round4Scenarios = [
{text:"鼓励他人坚持努力，有志者事竟成。",answerId:20},
{text:"强调团队合作、人多力量大。",answerId:2},
{text:"说明不付出就没有收获。",answerId:21},
{text:"说明熟能生巧的道理。",answerId:19},
{text:"鼓励终身学习，活到老学到老。",answerId:24},
{text:"提醒珍惜时间，岁月不待人。",answerId:43},
{text:"强调知识的力量。",answerId:18},
{text:"说明事物都有两面性。",answerId:5},
{text:"说明患难见真情。",answerId:34},
{text:"劝人别怕开始得晚，迟做总比不做好。",answerId:22},
{text:"强调分秒必争、珍惜每分钟。",answerId:26},
{text:"鼓励身处逆境也要积极翻盘。",answerId:31},
{text:"说明良好的开端是成功的一半。",answerId:27},
{text:"说明欢笑是最好的良药。",answerId:40},
{text:"说明努力终会收获成效、开花结果。",answerId:8}
];

function generateRound4Question() {
var type = Math.floor(Math.random() * 3);
var p = null;
if (type === 2) {
var scIds = round4Scenarios.map(function(s){ return s.answerId; });
var pool = proverbs.filter(function(x){ return scIds.indexOf(x.id) !== -1; });
p = pool[Math.floor(Math.random() * pool.length)];
} else {
p = proverbs[Math.floor(Math.random() * proverbs.length)];
}
var q = null;
if (type === 0) {
var others = proverbs.filter(function(x){ return x.id !== p.id; });
var wrongs = pickRandom(others, 3).map(function(x){ return x.cn; });
var opts = shuffle([p.cn].concat(wrongs));
q = {type:"en2cn", question: p.en, options: opts, correctAnswer: p.cn, proverb: p};
} else if (type === 1) {
var others = proverbs.filter(function(x){ return x.id !== p.id; });
var wrongs = pickRandom(others, 3).map(function(x){ return x.en; });
var opts = shuffle([p.en].concat(wrongs));
q = {type:"cn2en", question: p.cn, options: opts, correctAnswer: p.en, proverb: p};
} else {
var sc = round4Scenarios.find(function(s){ return s.answerId === p.id; });
var correctP = proverbs.find(function(x){ return x.id === sc.answerId; });
var others = proverbs.filter(function(x){ return x.id !== sc.answerId; });
var wrongs = pickRandom(others, 3).map(function(x){ return x.en; });
var opts = shuffle([correctP.en].concat(wrongs));
q = {type:"scenario", question: sc.text, options: opts, correctAnswer: correctP.en, proverb: correctP};
}
renderRound4Question(q);
}

function renderRound4Question(q) {
var main = document.getElementById("main-area");
var typeLabel = q.type === "en2cn" ? "英译中" : (q.type === "cn2en" ? "中译英" : "情景选谚");
var html = "";
html += '<div class="mb-2 text-sm text-gray-500 font-medium">玩家 ' + state.round4ActivePlayer + ' 挑战中...</div>';
html += '<div class="bg-white rounded-md shadow-sm p-4 md:p-5 mb-4 w-full max-w-2xl text-center">';
html += '<span class="inline-block bg-[#1F3A5F] text-white text-xs px-2 py-0.5 rounded mb-2">' + typeLabel + '</span>';
html += '<h2 class="text-lg md:text-xl font-bold text-[#1F3A5F] leading-relaxed">' + escHtml(q.question) + '</h2>';
html += '</div>';
html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-2 w-full max-w-2xl" id="options-grid">';
for (var i = 0; i < q.options.length; i++) {
html += '<button onclick="handleR4Answer(this,\'' + escAttr(q.options[i]) + '\',\'' + escAttr(q.correctAnswer) + '\')" class="opt-btn bg-white border-2 border-gray-200 rounded-md p-3 text-left text-sm md:text-base text-[#1F3A5F] shadow-sm hover:border-[#F2B84B]">';
html += '<span class="font-bold text-gray-400 mr-1">' + String.fromCharCode(65+i) + '.</span>';
html += escHtml(q.options[i]);
html += '</button>';
}
html += '</div>';
main.innerHTML = html;
state.isLocked = false;
}

function handleR4Answer(btn, selected, correct) {
if (state.isLocked) return;
state.isLocked = true;
state.round4Total[state.round4ActivePlayer - 1]++;
var isCorrect = selected === correct;
if (isCorrect) {
state.combos[state.round4ActivePlayer - 1]++;
state.round4Correct[state.round4ActivePlayer - 1]++;
var bonus = state.combos[state.round4ActivePlayer - 1] >= 3 ? 5 : 0;
var pts = 10 + bonus;
state.scores[state.round4ActivePlayer - 1] += pts;
updateScoreDisplay();
playCorrectSound();
highlightBtn(btn, true);
showComboFloat(state.combos[state.round4ActivePlayer - 1]);
clearFeedback();
} else {
state.combos[state.round4ActivePlayer - 1] = 0;
playWrongSound();
highlightBtn(btn, false);
markCorrectOption(correct);
showFeedbackRaw("", "正确答案：" + correct, "#D96C6C");
}
disableOptions();
setTimeout(function(){
if (state.timeLeft > 0) {
generateRound4Question();
}
}, isCorrect ? 500 : 1200);
}

function endRound4Turn() {
stopTimer();
state.isLocked = true;
if (state.round4ActivePlayer === 1) {
var panel = document.getElementById("overlay-panel");
var html = "";
html += '<h2 class="text-xl font-bold text-[#1F3A5F] mb-3">玩家1 挑战结束！</h2>';
html += '<p class="text-gray-600 mb-2">答对 ' + state.round4Correct[0] + ' 题 / 共 ' + state.round4Total[0] + ' 题</p>';
html += '<p class="text-2xl font-bold text-[#F2B84B] mb-4">当前得分：' + state.scores[0] + '</p>';
html += '<p class="text-sm text-gray-500 mb-4">现在轮到玩家2挑战！</p>';
html += '<button onclick="startRound4Turn(2)" class="bg-blue-500 hover:bg-blue-600 text-white font-bold px-8 py-3 rounded shadow transition-all hover:scale-105">玩家2 开始</button>';
panel.innerHTML = html;
showOverlay();
} else {
endLevel();
}
}

function showFinalResult() {
var p1 = state.scores[0];
var p2 = state.scores[1];
var winner = p1 > p2 ? 1 : (p2 > p1 ? 2 : 0);
var maxScore = Math.max(p1, p2);
var stars = maxScore >= 150 ? 3 : (maxScore >= 80 ? 2 : 1);
var panel = document.getElementById("overlay-panel");
var html = "";
html += '<h2 class="text-3xl font-bold text-[#1F3A5F] mb-2">对战结束！</h2>';
var animals = ['🐶', '🐱', '🐼', '🐰', '🦄', '🐻', '🐯', '🦁', '🐷', '🐨'];
var randomAnimal = animals[Math.floor(Math.random() * animals.length)];
if (winner === 0) {
html += '<div class="mb-4">';
var animal1 = animals[Math.floor(Math.random() * animals.length)];
var animal2 = animals[Math.floor(Math.random() * animals.length)];
html += '<div class="text-8xl mb-3 bounce-it inline-block drop-shadow-2xl" style="filter: brightness(1.4) saturate(1.8) contrast(1.2);">' + animal1 + ' ' + animal2 + '</div>';
html += '<p class="text-xl text-[#F2B84B] font-bold mb-2">平局！势均力敌！</p>';
html += '<p class="text-sm text-gray-600">两位都很棒，继续加油！</p>';
html += '</div>';
} else {
html += '<div class="mb-4">';
html += '<div class="text-9xl mb-3 bounce-it inline-block drop-shadow-2xl" style="filter: brightness(1.4) saturate(1.8) contrast(1.2);">' + randomAnimal + '</div>';
html += '<p class="text-xl text-[#F2B84B] font-bold mb-2">🏆 玩家 ' + winner + ' 获胜！</p>';
html += '<p class="text-sm text-gray-600">恭喜你赢得了可爱的小动物礼物！</p>';
html += '</div>';
}
html += '<div class="flex justify-center gap-8 mb-4">';
html += '<div class="text-center"><p class="text-sm text-gray-500">玩家1</p><p class="text-4xl font-bold text-[#F2B84B]">' + p1 + '</p></div>';
html += '<div class="text-center"><p class="text-sm text-gray-500">玩家2</p><p class="text-4xl font-bold text-blue-500">' + p2 + '</p></div>';
html += '</div>';
html += '<div class="flex justify-center gap-1 mb-4">';
for (var i = 0; i < 3; i++) {
if (i < stars) {
html += '<span class="text-3xl text-[#F2B84B]">★</span>';
} else {
html += '<span class="text-3xl text-gray-300">★</span>';
}
}
html += '</div>';
html += '<p class="text-sm text-gray-500 mb-1">玩家1答对 ' + state.round4Correct[0] + ' 题（第4关）</p>';
html += '<p class="text-sm text-gray-500 mb-4">玩家2答对 ' + state.round4Correct[1] + ' 题（第4关）</p>';
html += '<div class="flex justify-center gap-3">';
html += '<button onclick="restartGame()" class="bg-[#F2B84B] hover:bg-yellow-500 text-[#1F3A5F] font-bold px-8 py-3 rounded shadow transition-all hover:scale-105">再来一局</button>';
html += '<button onclick="backToStart()" class="bg-white border-2 border-[#1F3A5F] text-[#1F3A5F] font-bold px-8 py-3 rounded shadow transition-all hover:scale-105">返回首页</button>';
html += '</div>';
panel.innerHTML = html;
showOverlay();
}

function allOptionButtons() {
return document.querySelectorAll("#options-grid .opt-btn, #l3-options .opt-btn, #options-p1 .opt-btn, #options-p2 .opt-btn");
}

function highlightBtn(btn, correct) {
var buttons = allOptionButtons();
buttons.forEach(function(b){ b.disabled = true; });
if (!btn) return;
if (correct) {
btn.classList.remove("border-gray-200");
btn.classList.add("border-[#4CAF7D]", "bg-green-50", "bounce-it");
btn.innerHTML = '<span class="text-[#4CAF7D] font-bold mr-1">✓</span>' + btn.innerHTML;
} else {
btn.classList.remove("border-gray-200");
btn.classList.add("border-[#D96C6C]", "bg-red-50", "shake-it");
btn.innerHTML = '<span class="text-[#D96C6C] font-bold mr-1">✗</span>' + btn.innerHTML;
}
}

function markCorrectOption(correctText) {
var buttons = allOptionButtons();
buttons.forEach(function(b){
b.disabled = true;
var txt = b.textContent.trim();
var oc = b.getAttribute("onclick") || "";
if (txt.indexOf(correctText) !== -1 || oc.indexOf(escAttr(correctText)) !== -1) {
if (!b.classList.contains("border-[#D96C6C]")) {
b.classList.remove("border-gray-200");
b.classList.add("border-[#4CAF7D]", "bg-green-50");
b.innerHTML = '<span class="text-[#4CAF7D] font-bold mr-1">✓</span>' + b.innerHTML;
}
}
});
}

function disableOptions() {
var buttons = allOptionButtons();
buttons.forEach(function(b){ b.disabled = true; });
}

function showFeedbackRaw(msg, detail, bgColor) {
var area = document.getElementById("feedback-area");
area.style.backgroundColor = bgColor;
var content = document.getElementById("feedback-content");
var html = "";
if (msg) html += '<p class="text-white font-bold text-base md:text-lg">' + msg + '</p>';
if (detail) html += '<p class="text-white/90 text-sm mt-1">' + detail + '</p>';
content.innerHTML = html;
}

function clearFeedback() {
var area = document.getElementById("feedback-area");
area.style.backgroundColor = "transparent";
document.getElementById("feedback-content").innerHTML = "";
document.getElementById("combo-float").innerHTML = "";
}

function showComboFloat(combo) {
if (combo < 2) return;
var el = document.getElementById("combo-float");
var text = combo >= 3 ? "🔥 势不可挡！连击x" + combo : "⚡ 连续答对 " + combo + " 题！";
el.innerHTML = '<div class="float-combo bg-[#F2B84B] text-[#1F3A5F] font-bold px-4 py-1.5 rounded-full text-sm shadow whitespace-nowrap">' + text + '</div>';
setTimeout(function(){ el.innerHTML = ""; }, 1300);
}

function randomEncourage() {
var msgs = ["太棒了！","完全正确！","真厉害！","继续保持！","非常好！"];
return msgs[Math.floor(Math.random() * msgs.length)];
}

function randomWrongMsg() {
var msgs = ["再想想哦～","差一点点！","不要灰心！","换个思路试试～"];
return msgs[Math.floor(Math.random() * msgs.length)];
}

function startCountdown(seconds, onEnd) {
stopTimer();
state.timeLeft = seconds;
setTimerText(state.timeLeft);
state.timerInterval = setInterval(function(){
state.timeLeft--;
setTimerText(state.timeLeft);
if (state.timeLeft <= 0) {
stopTimer();
if (onEnd) onEnd();
}
}, 1000);
}

function stopTimer() {
if (state.timerInterval) {
clearInterval(state.timerInterval);
state.timerInterval = null;
}
}

function showOverlay() {
document.getElementById("overlay").classList.remove("hidden");
}

function hideOverlay() {
document.getElementById("overlay").classList.add("hidden");
}

function escHtml(str) {
var div = document.createElement("div");
div.appendChild(document.createTextNode(str));
return div.innerHTML;
}

function escAttr(str) {
return str.replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "&quot;");
}
